
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Little Surprise For You 💗</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="background-glow"></div>
  <div class="sparkle sparkle-one">✧</div>
  <div class="sparkle sparkle-two">♡</div>
  <div class="sparkle sparkle-three">✦</div>
  <div class="floating-heart heart-one">♡</div>
  <div class="floating-heart heart-two">♡</div>

  <main class="screen">
    <div class="top-label">A LITTLE SOMETHING FOR YOU ♡</div>

    <section class="popup" id="popup">
      <div class="flower">🌷</div>
      <div class="step-label" id="stepLabel">A SPECIAL MESSAGE</div>
      <h1 id="title">Aloooo Assalamu'alaikum Abanggg</h1>
      
      <p id="message">Ada sesuatu nih buat abang. Tapi bukanya jangan buru-buru yaa hehe ☺️</p>

      <div id="media" class="media hidden"></div>

      <div id="extra" class="extra hidden"></div>

      <div class="progress" id="progress"></div>

      <div class="actions">
        <button id="backBtn" class="back-btn hidden">← Kembali</button>
        <button id="nextBtn" class="next-btn">Klik di sini ♡</button>
      </div>
      <div class="tiny-note">Dibuat khusus untuk Abang Alfan Alifa ✧</div>
    </section>

    <div class="bottom-label">FOR SOMEONE SPECIAL ♡</div>
  </main>

  <script src="script.js"></script>

</body>
</html>
